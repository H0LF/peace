[project]
name = "peace"
version = "0.1.0"
description = "PEACE: personal academic secretary backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "graphifyy==0.9.95",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pypdf>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
peace-api = "peace.api:main"
peace-worker = "peace.worker:main"
peace-voice = "peace.voice:main"

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2",
    "python-multipart>=0.0.20",
    "supertonic>=1.3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
